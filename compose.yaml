name: backend-challenge

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backend_challenge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backend_challenge_local}
      POSTGRES_USER: ${POSTGRES_USER:-backend_challenge}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  ministack:
    image: ministackorg/ministack:1.5.21
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    ports:
      - "127.0.0.1:${MINISTACK_PORT:-4566}:4566"
    volumes:
      - ./infrastructure/ministack/init:/docker-entrypoint-initaws.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - aws --endpoint-url=http://127.0.0.1:4566 --region "$$AWS_DEFAULT_REGION" sqs get-queue-url --queue-name wager-transactions.fifo >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
